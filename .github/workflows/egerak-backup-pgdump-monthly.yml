# eGerak v2 — pg_dump bulanan (monorepo: jalankan dalam egerak-v2/)
name: Sandaran pg_dump bulanan (eGerak)

on:
  schedule:
    - cron: "0 18 1 * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: egerak-v2

jobs:
  pgdump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: egerak-v2/package-lock.json

      - name: Pasang PostgreSQL client 17 (padanan Supabase PG 17)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          sudo sh -c "echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main' > /etc/apt/sources.list.d/pgdg.list"
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - run: npm ci

      - name: pg_dump + muat naik Drive
        env:
          PGDUMP_DATABASE_URL: ${{ secrets.PGDUMP_DATABASE_URL }}
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}
          GAS_UPLOAD_SECRET: ${{ secrets.GAS_UPLOAD_SECRET }}
        run: npm run db:backup-pgdump:upload
